version: 2
updates:
  # Monthly, one grouped PR for minor and patch bumps. Cooldown: propose a release only once it
  # has been out 14 days, past the window in which most malicious releases are caught and pulled.
  # Security updates are not delayed.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
